name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim:
          - v0.9.5
          - v0.10.4
          - stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check formatting with StyLua
        run: npx -y @johnnymorganz/stylua-bin --check lua plugin tests

      - name: Lint with Luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: -r lua plugin tests

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: All tests
        run: ./tests/run_all.sh
